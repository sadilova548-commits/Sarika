
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sarika — ИИ-Учёба</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">
    <!-- Шапка -->
    <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between shadow-xs">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center 

text-white font-bold">S</div>
            <span class="text-xl font-bold tracking-tight text-slate-900">Sarika</span>
            <span class="text-xs bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded-full font-medium">ИИ-Учёба</span>
        </div>
        <div class="text-sm text-slate-500">Без лимитов и подписок</div>
    </header>

    <!-- Навигация -->
    <nav class="bg-white border-b border-slate-200 px-6 flex space-x-6">
        <button onclick="switchTab('desk')" id="btn-desk" class="py-3 font-medium text-indigo-600 border-b-2 border-indigo-600 cursor-pointer">Рабочий стол</button>

        <button onclick="switchTab('chat')" id="btn-chat" class="py-3 font-medium text-slate-500 hover:text-slate-800 cursor-pointer">Чат</button>
        <button onclick="switchTab('library')" id="btn-library" class="py-3 font-medium text-slate-500 hover:text-slate-800 cursor-pointer">Библиотека <span id="lib-count" class="ml-1 text-xs bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded-full">1</span></button>
    </nav>

    <!-- Основной контент -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-6">
        <!-- Вкладка: Рабочий стол -->
        <div id="tab-desk" class="space-y-6">
            <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-xs text-center">

                <h1 class="text-2xl font-bold text-slate-900 mb-2">Рабочий стол</h1>
                <p class="text-slate-500 mb-6">Загрузите материалы для учёбы (PDF, TXT, фото)</p>
                <label class="border-2 border-dashed border-slate-300 rounded-xl p-8 hover:border-indigo-500 transition cursor-pointer bg-slate-50 block">
                    <input type="file" id="file-input" class="hidden" multiple onchange="handleFiles(this.files)">
                    <p class="text-slate-600 font-medium">Перетащите файл сюда или <span class="text-indigo-600 underline">выберите</span></p>
                    <p class="text-xs text-slate-400 mt-1">PDF, TXT, PNG, JPG — до 25 МБ</p>
                </label>
                <div id="upload-status" class="mt-4 text-sm font-medium text-

emerald-600 hidden">Файл успешно добавлен в библиотеку! ✨</div>
            </div>
        </div>

        <!-- Вкладка: Чат -->
        <div id="tab-chat" class="hidden space-y-4">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 h-[65vh] flex flex-col justify-between shadow-xs">
                <div id="chat-messages" class="overflow-y-auto space-y-3 flex-1 pr-2">
                    <div class="bg-indigo-50 text-indigo-900 p-3 rounded-xl max-w-[85%] text-sm">
                        Привет! Я Sarika, твой ИИ-помощник. Чем зайдемся сегодня? 🚀
                    </div>

                </div>
                <div class="flex gap-2 mt-4 pt-2 border-t border-slate-100">
                    <input type="text" id="chat-input" placeholder="Спросите о чем угодно..." class="flex-1 border border-slate-300 rounded-xl px-4 py-2 focus:outline-none focus:border-indigo-500 text-sm" onkeydown="if(event.key === 'Enter') sendMessage()">
                    <button onclick="sendMessage()" class="bg-indigo-600 text-white px-5 py-2 rounded-xl font-medium hover:bg-indigo-700 transition cursor-pointer text-sm">Отправить</button>
                </div>
            </div>
        </div>

        <!-- Вкладка: Библиотека -->
        <div id="tab-library" class="hidden space-y-4">
            <h2 class="text-xl font-bold text-slate-900">Ваши материалы</h2>
            <div id="library-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex justify-between items-center">
                    <div>
                        <h3 class="font-semibold text-slate-800 text-sm">Cell Biology — Chapter 4.pdf</h3>
                        <p class="text-xs text-indigo-600 mt-1">Конспект создан ИИ</p>
                    </div>
                    <span class="text-xs bg-slate-100 text-slate-500 px-2 py-1 rounded-md">PDF</span>

                </div>
            </div>
        </div>
    </main>

    <script>
        let uploadedFiles = [{ name: "Cell Biology — Chapter 4.pdf", size: "2.4 MB" }];

        function switchTab(tab) {
            ['desk', 'chat', 'library'].forEach(t => {
                let el = document.getElementById('tab-' + t);
                let btn = document.getElementById('btn-' + t);
                if(el && btn) {
                    el.classList.add('hidden');
                    btn.className = "py-3 font-medium text-slate-500 hover:text-slate-800 cursor-pointer";
                }

            });
            let targetTab = document.getElementById('tab-' + tab);
            let targetBtn = document.getElementById('btn-' + tab);
            if(targetTab && targetBtn) {
                targetTab.classList.remove('hidden');
                targetBtn.className = "py-3 font-medium text-indigo-600 border-b-2 border-indigo-600 cursor-pointer";
            }
        }

        function handleFiles(files) {
            if (!files || files.length === 0) return;
            for (let file of files) {
                uploadedFiles.push({ name: file.name, size: (file.size / (1024*1024)).toFixed(1) + " MB" });
            }

            updateLibrary();
            let status = document.getElementById('upload-status');
            if(status) {
                status.classList.remove('hidden');
                setTimeout(() => status.classList.add('hidden'), 4000);
            }
        }

        function updateLibrary() {
            let grid = document.getElementById('library-grid');
            let count = document.getElementById('lib-count');
            if(count) count.innerText = uploadedFiles.length;
            if(!grid) return;
            grid.innerHTML = '';
            uploadedFiles.forEach(f => {
                grid.innerHTML += `

                    <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-xs flex justify-between items-center">
                        <div>
                            <h3 class="font-semibold text-slate-800 text-sm">${f.name}</h3>
                            <p class="text-xs text-indigo-600 mt-1">Загружено • ${f.size}</p>
                        </div>
                        <span class="text-xs bg-slate-100 text-slate-500 px-2 py-1 rounded-md uppercase">Файл</span>
                    </div>
                `;
            });
        }

        async function sendMessage() {
            let input = 

document.getElementById('chat-input');
            if(!input) return;
            let text = input.value.trim();
            if (!text) return;

            let chatBox = document.getElementById('chat-messages');
            if(!chatBox) return;
            
            // Выводим сообщение пользователя
            chatBox.innerHTML += `
                <div class="flex justify-end">
                    <div class="bg-indigo-600 text-white p-3 rounded-xl max-w-[85%] text-sm">${text}</div>
                </div>
            `;
            input.value = '';
            chatBox.scrollTop = 

chatBox.scrollHeight;

            // Индикатор печати
            let loadingId = 'loading_' + Date.now();
            chatBox.innerHTML += `
                <div id="${loadingId}" class="flex justify-start">
                    <div class="bg-indigo-50 text-indigo-600 p-3 rounded-xl text-sm animate-pulse">Печатает ответ...</div>
                </div>
            `;
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                // Запрос к реальному Gemini API (используем публичный эмуляционный эндпоинт или локальный прокси)

                let response = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=YOUR_API_KEY", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }]
                    })
                });
                
                let data = await response.json();
                let aiReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "Извините, не удалось получить ответ.";

                

document.getElementById(loadingId).remove();
                chatBox.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-indigo-50 text-indigo-900 p-3 rounded-xl max-w-[85%] text-sm">${aiReply}</div>
                    </div>
                `;
            } catch (err) {
                document.getElementById(loadingId).remove();
                chatBox.innerHTML += `
                    <div class="flex justify-start">
                        <div class="bg-rose-50 text-rose-900 p-3 rounded-xl max-w-[85%] text-sm">Ошибка подключения к сети. Проверьте интернет.</div>
                    </div>
                `;

            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
